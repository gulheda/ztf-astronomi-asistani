name: SNAD pilot training
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'astro_assistant/snad_dataset.py'
      - 'astro_assistant/snad_train.py'
      - 'tests/test_snad_dataset.py'
      - 'requirements-pilot.txt'
      - '.github/workflows/snad-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-inference.txt
            requirements-pilot.txt
      - run: python -m pip install --upgrade 'setuptools>=83' pip-audit
      - run: python -m pip install -r requirements-pilot.txt
      - uses: actions/cache@v6
        with:
          path: data/raw/snad
          key: snad-source-15076426-v1
      - run: python -m unittest discover -s tests -p test_snad_dataset.py -v
      - run: python -m astro_assistant.snad_train --output output/snad-pilot --epochs 12
      - name: Record and audit environment
        run: |
          python -m pip freeze > output/snad-pilot/environment.txt
          python -m pip_audit --format json --output output/snad-pilot/dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snad-pilot
          path: |
            output/snad-pilot
            !output/snad-pilot/dataset/dataset.npz
          retention-days: 30
