name: SNAD data audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'astro_assistant/snad_audit.py'
      - 'tests/test_snad_audit.py'
      - '.github/workflows/snad-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'setuptools>=83' numpy==1.26.4 astropy==6.1.7
      - run: python -m unittest discover -s tests -p test_snad_audit.py -v
      - run: python -m astro_assistant.snad_audit --output output/snad-audit
      - uses: actions/upload-artifact@v4
        with:
          name: snad-data-audit
          path: output/snad-audit
          retention-days: 30
