name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install interface dependencies
        run: python -m pip install -r requirements.txt
      - name: Run core and interface tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q astro_assistant app.py tests
      - name: Run terminal demo
        run: python -m astro_assistant --demo
