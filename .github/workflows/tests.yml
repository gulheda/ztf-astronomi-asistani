name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install interface dependencies
        run: python -m pip install -r requirements.txt 'numpy>=1.24,<3'
      - name: Run core and interface tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q astro_assistant app.py tests
      - name: Run terminal demo
        run: python -m astro_assistant --demo
      - name: Audit installed application dependencies
        run: |
          python -m pip install --upgrade 'setuptools>=83' pip-audit
          python -m pip_audit

  archive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install browser check dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Install headless Chromium
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Capture real archive and demo interface
        run: python tests/capture_archive_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-interface-captures
          path: output/ui
          retention-days: 30
