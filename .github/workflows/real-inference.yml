name: Real ZTF inference

on:
  pull_request:
    paths:
      - 'astro_assistant/braai.py'
      - 'requirements-inference.txt'
      - '.github/workflows/real-inference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      TF_CPP_MIN_LOG_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-inference.txt
      - run: python -m pip install -r requirements-inference.txt
      - name: Validate cutout handling and source verification
        run: python -m unittest discover -s tests -p test_braai.py -v
      - name: Published model on real alert examples
        run: python -m astro_assistant.braai --output output/real-inference
      - name: Record environment
        run: python -m pip freeze > output/real-inference/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: real-ztf-inference
          path: output/real-inference
          retention-days: 30
